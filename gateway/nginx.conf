# Cổng vào duy nhất. Chạy HTTPS: đặt Cloudflare phía trước, hoặc thêm khối listen 443 ssl (Let's Encrypt)
# rồi đặt COOKIE_SECURE=true và WEB_URL=https://ten-mien-cua-ban.

limit_req_zone $binary_remote_addr zone=chung:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;

upstream giaodien  { server giaodien:3000; }
upstream thanhtoan { server thanhtoan:8080; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API nội bộ giữa các dịch vụ không bao giờ ra ngoài
    location /noi-bo/ { return 404; }

    # Ảnh sản phẩm do ProductService ghi vào volume dùng chung
    location /anh/ {
        alias /anh/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Webhook giao dịch ngân hàng và IPN của SePay -> PaymentService
    location ~ ^/(webhook|ipn)/ {
        limit_req zone=webhook burst=20 nodelay;
        proxy_pass http://thanhtoan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Còn lại: Next.js (cửa hàng, admin, BFF gọi các dịch vụ)
    location / {
        limit_req zone=chung burst=60 nodelay;
        proxy_pass http://giaodien;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
