name: thoi-trang

# Chạy: docker compose up -d --build
# Mở:   http://localhost:8080   (hộp thư thử nghiệm: http://localhost:8025)

x-dich-vu-chung: &dich-vu-chung
  restart: unless-stopped

services:
  # ---------- CSDL ----------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${MSSQL_PHIEN_BAN:-2022-latest}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express            # Developer chỉ dành cho phát triển, không dùng cho site thật
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver_du_lieu:/var/opt/mssql
    # Muốn nối SSMS/Azure Data Studio từ máy bạn: bỏ comment dòng dưới (chỉ mở cho localhost)
    # ports: ["127.0.0.1:1433:1433"]

  csdl_khoi_tao:                    # chạy 1 lần: tạo 6 CSDL (chỉ cấu trúc) + tài khoản dịch vụ
    build: ./sql
    restart: "no"
    depends_on: [sqlserver]
    environment:
      DB_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MK_NGUOIDUNG: ${MK_NGUOIDUNG}
      MK_SANPHAM: ${MK_SANPHAM}
      MK_GIOHANG: ${MK_GIOHANG}
      MK_DONHANG: ${MK_DONHANG}
      MK_THANHTOAN: ${MK_THANHTOAN}
      MK_THONGBAO: ${MK_THONGBAO}

  # ---------- 6 dịch vụ ----------
  nguoidung:                        # Python · FastAPI
    <<: *dich-vu-chung
    build: ./dich-vu/nguoi-dung
    depends_on:
      csdl_khoi_tao: { condition: service_completed_successfully }
    environment:
      DB_HOST: sqlserver
      DB_NAME: ThoiTrang_NguoiDung
      DB_USER: dv_nguoidung
      DB_PASSWORD: ${MK_NGUOIDUNG}
      KHOA_NOI_BO: ${KHOA_NOI_BO}
      WEB_URL: ${WEB_URL}
      THONG_BAO_URL: http://thongbao:8080
      TEN_CUA_HANG: ${TEN_CUA_HANG}
    volumes:
      - khoa_jwt:/khoa
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  sanpham:                          # C# · ASP.NET Core
    <<: *dich-vu-chung
    build: ./dich-vu/san-pham
    depends_on:
      csdl_khoi_tao: { condition: service_completed_successfully }
      nguoidung: { condition: service_healthy }
    environment:
      DB_HOST: sqlserver
      DB_NAME: ThoiTrang_SanPham
      DB_USER: dv_sanpham
      DB_PASSWORD: ${MK_SANPHAM}
      KHOA_NOI_BO: ${KHOA_NOI_BO}
      DON_HANG_URL: http://donhang:8080
      THU_MUC_ANH: /du-lieu/anh
    volumes:
      - khoa_jwt:/khoa:ro
      - anh_san_pham:/du-lieu/anh

  giohang:                          # Node.js · Express
    <<: *dich-vu-chung
    build: ./dich-vu/gio-hang
    depends_on:
      csdl_khoi_tao: { condition: service_completed_successfully }
      nguoidung: { condition: service_healthy }
    environment:
      DB_HOST: sqlserver
      DB_NAME: ThoiTrang_GioHang
      DB_USER: dv_giohang
      DB_PASSWORD: ${MK_GIOHANG}
      KHOA_NOI_BO: ${KHOA_NOI_BO}
      SAN_PHAM_URL: http://sanpham:8080
    volumes:
      - khoa_jwt:/khoa:ro

  donhang:                          # Java · Spring Boot
    <<: *dich-vu-chung
    build: ./dich-vu/don-hang
    depends_on:
      csdl_khoi_tao: { condition: service_completed_successfully }
      nguoidung: { condition: service_healthy }
    environment:
      DB_HOST: sqlserver
      DB_NAME: ThoiTrang_DonHang
      DB_USER: dv_donhang
      DB_PASSWORD: ${MK_DONHANG}
      KHOA_NOI_BO: ${KHOA_NOI_BO}
      SAN_PHAM_URL: http://sanpham:8080
      THANH_TOAN_URL: http://thanhtoan:8080
      THONG_BAO_URL: http://thongbao:8080
      TEN_CUA_HANG: ${TEN_CUA_HANG}
      WEB_URL: ${WEB_URL}
      PHI_VAN_CHUYEN: ${PHI_VAN_CHUYEN:-30000}
      MIEN_PHI_VAN_CHUYEN_TU: ${MIEN_PHI_VAN_CHUYEN_TU:-500000}
      HAN_THANH_TOAN_PHUT: ${HAN_THANH_TOAN_PHUT:-15}
    volumes:
      - khoa_jwt:/khoa:ro

  thanhtoan:                        # Go · Gin
    <<: *dich-vu-chung
    build: ./dich-vu/thanh-toan
    depends_on:
      csdl_khoi_tao: { condition: service_completed_successfully }
      nguoidung: { condition: service_healthy }
    environment:
      DB_HOST: sqlserver
      DB_NAME: ThoiTrang_ThanhToan
      DB_USER: dv_thanhtoan
      DB_PASSWORD: ${MK_THANHTOAN}
      KHOA_NOI_BO: ${KHOA_NOI_BO}
      DON_HANG_URL: http://donhang:8080
      WEB_URL: ${WEB_URL}
      NGAN_HANG_TEN: ${NGAN_HANG_TEN}
      NGAN_HANG_BIN: ${NGAN_HANG_BIN}
      NGAN_HANG_SO_TAI_KHOAN: ${NGAN_HANG_SO_TAI_KHOAN}
      NGAN_HANG_TEN_CHU_TK: ${NGAN_HANG_TEN_CHU_TK}
      MA_THANH_TOAN_TIEN_TO: ${MA_THANH_TOAN_TIEN_TO:-TT}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY}
      SEPAY_PG_MERCHANT_ID: ${SEPAY_PG_MERCHANT_ID:-}
      SEPAY_PG_SECRET_KEY: ${SEPAY_PG_SECRET_KEY:-}
      SEPAY_PG_MOI_TRUONG: ${SEPAY_PG_MOI_TRUONG:-sandbox}
    volumes:
      - khoa_jwt:/khoa:ro

  thongbao: &thongbao               # PHP · Laravel
    <<: *dich-vu-chung
    build: ./dich-vu/thong-bao
    depends_on:
      csdl_khoi_tao: { condition: service_completed_successfully }
      nguoidung: { condition: service_healthy }
    environment: &moi-truong-thong-bao
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY_THONG_BAO}
      DB_CONNECTION: sqlsrv
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_DATABASE: ThoiTrang_ThongBao
      DB_USERNAME: dv_thongbao
      DB_PASSWORD: ${MK_THONGBAO}
      DB_TRUST_SERVER_CERTIFICATE: "true"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      KHOA_NOI_BO: ${KHOA_NOI_BO}
      WEB_URL: ${WEB_URL}
      TEN_CUA_HANG: ${TEN_CUA_HANG}
      THU_MUC_KHOA: /khoa
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@localhost}
      MAIL_FROM_NAME: ${TEN_CUA_HANG}
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - khoa_jwt:/khoa:ro

  thongbao_gui_lai:                 # chạy lịch của Laravel: gửi lại email lỗi mỗi phút
    <<: *dich-vu-chung
    build: ./dich-vu/thong-bao
    command: ["php", "artisan", "schedule:work"]
    depends_on: [thongbao]
    environment: *moi-truong-thong-bao

  # ---------- Giao diện + cổng vào ----------
  giaodien:                         # Next.js (cửa hàng + admin + BFF)
    <<: *dich-vu-chung
    build:
      context: ./giao-dien
      args:
        NEXT_PUBLIC_TEN_CUA_HANG: ${TEN_CUA_HANG}
    depends_on: [nguoidung, sanpham, giohang, donhang, thanhtoan, thongbao]
    environment:
      NGUOI_DUNG_URL: http://nguoidung:8000
      SAN_PHAM_URL: http://sanpham:8080
      GIO_HANG_URL: http://giohang:3000
      DON_HANG_URL: http://donhang:8080
      THANH_TOAN_URL: http://thanhtoan:8080
      THONG_BAO_URL: http://thongbao:8080
      KHOA_NOI_BO: ${KHOA_NOI_BO}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_URL: ${WEB_URL}
      LIEN_HE_DIA_CHI: ${LIEN_HE_DIA_CHI:-}
      LIEN_HE_DIEN_THOAI: ${LIEN_HE_DIEN_THOAI:-}
      LIEN_HE_EMAIL: ${LIEN_HE_EMAIL:-}
      LIEN_HE_GIO_LAM_VIEC: ${LIEN_HE_GIO_LAM_VIEC:-}
      HOSTNAME: 0.0.0.0

  gateway:                          # Nginx: cổng vào duy nhất, giới hạn tốc độ, ảnh tĩnh, webhook thanh toán
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [giaodien, thanhtoan]
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - anh_san_pham:/anh:ro

  mailpit:                          # hộp thư thử nghiệm; khi chạy thật hãy đặt MAIL_* trỏ tới SMTP thật rồi xóa dịch vụ này
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  sqlserver_du_lieu:
  khoa_jwt:
  anh_san_pham:
