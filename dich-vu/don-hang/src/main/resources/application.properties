server.port=8080
server.shutdown=graceful
server.error.include-message=never
spring.application.name=don-hang
spring.main.banner-mode=off
spring.jackson.default-property-inclusion=always
spring.jackson.deserialization.fail-on-unknown-properties=false

spring.datasource.url=jdbc:sqlserver://${DB_HOST:sqlserver}:${DB_PORT:1433};databaseName=${DB_NAME:ThoiTrang_DonHang};encrypt=true;trustServerCertificate=true;loginTimeout=15
spring.datasource.username=${DB_USER:dv_donhang}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

ung-dung.khoa-noi-bo=${KHOA_NOI_BO}
ung-dung.thu-muc-khoa=${THU_MUC_KHOA:/khoa}
ung-dung.san-pham-url=${SAN_PHAM_URL:http://sanpham:8080}
ung-dung.thanh-toan-url=${THANH_TOAN_URL:http://thanhtoan:8080}
ung-dung.thong-bao-url=${THONG_BAO_URL:http://thongbao:8080}
ung-dung.web-url=${WEB_URL:http://localhost:8080}
ung-dung.ten-cua-hang=${TEN_CUA_HANG:BHD Fashion Store}
ung-dung.phi-van-chuyen=${PHI_VAN_CHUYEN:30000}
ung-dung.mien-phi-van-chuyen-tu=${MIEN_PHI_VAN_CHUYEN_TU:500000}
ung-dung.han-thanh-toan-phut=${HAN_THANH_TOAN_PHUT:15}
ung-dung.so-ngay-doi-tra=${SO_NGAY_DOI_TRA:7}
